# Cloudflare overwrites CF-Connecting-IP. Trust it only when the TCP peer is
# cloudflared or another private proxy. A visitor who reaches Nginx directly
# keeps $remote_addr, so a forged header cannot pick their rate-limit bucket.
geo $remote_addr $silat_trust_proxy {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
    ::1/128 1;
}

map $http_cf_connecting_ip $silat_cf_ip {
    ""      "";
    "~^[0-9a-fA-F:.]+$" $http_cf_connecting_ip;
    default "";
}

map "$silat_trust_proxy:$silat_cf_ip" $silat_client_ip {
    default $remote_addr;
    "~^1:.+" $silat_cf_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # ^~ keeps /api/uploads/*.jpg on the backend. Without it, the static
    # image rule below matches first and the uploaded file 404s.
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $silat_client_ip;
        proxy_set_header X-Forwarded-For $silat_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The static-asset rule below would pin service-worker.js for 30 days.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
